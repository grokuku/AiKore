services:
      aikore:
        # MODIFICATION ICI pour que Docker télécharge l'image depuis GitHub
        # Remplacez VOTRE_NOM_GITHUB/VOTRE_REPO par le vôtre (ex: grokuku/aikore)
        image: ghcr.io/grokuku/AiKore:latest
        container_name: aikore
        runtime: nvidia
        volumes:
          - "${STABLE_DIFFUSION_DATA_DIRECTORY:-./data}:/config:rw"
        ports:
          - "${AIKORE_PORT:-9000}:9000/tcp"
          - "${AIKORE_INSTANCE_PORT_RANGE:-9001-9020}:${AIKORE_INSTANCE_PORT_RANGE:-9001-9020}/tcp"
        environment:
          - NVIDIA_VISIBLE_DEVICES=${NVIDIA_VISIBLE_DEVICES:-all}
          - TZ=${TZ:-America/New_York}
          - PUID=${PUID:-1000}
          - PGID=${PGID:-1000}
          - AIKORE_INSTANCE_PORT_RANGE=${AIKORE_INSTANCE_PORT_RANGE:-9001-9020}
          # --- Authentication (strongly recommended behind a public proxy) ---
          # Generate a strong key with: openssl rand -hex 32
          # - AIKORE_API_KEY=${AIKORE_API_KEY:-}
          # --- WebSocket hardening ---
          # Extra Origins allowed for WebSocket cross-origin checks (comma-separated),
          # e.g. https://aikore.example.com,https://alt.example.net
          # - AIKORE_WS_ALLOWED_ORIGINS=${AIKORE_WS_ALLOWED_ORIGINS:-}
          # --- Extra public (unauthenticated) paths ---
          # Comma-separated, '/path' = exact, '/prefix*' = prefix
          # - AIKORE_AUTH_PUBLIC_PATHS=${AIKORE_AUTH_PUBLIC_PATHS:-}
          # --- Debug endpoint kill-switch ('false' disables /api/system/debug-nginx) ---
          # - AIKORE_ENABLE_DEBUG_NGINX=${AIKORE_ENABLE_DEBUG_NGINX:-true}