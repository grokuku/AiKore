<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AiKore Dashboard</title>
    <!-- Anti-FOUC du thème : exécuté AU PARSING, avant les CSS et les scripts
         defer/module → le premier paint a déjà le bon mode. Lit le thème
         persisté et pose data-theme/data-mode sur <html> ; les replis
         littéraux du mode clair vivent dans theme.css ([data-mode="light"])
         et couvrent la fenêtre où holaf-tokens.js (defer, non render-blocking)
         n'a pas encore posé les tokens --holaf-*.
         Ne duplique PAS le catalogue des packs : seul le MODE est déduit du
         suffixe « -dark »/« -light » (convention des 12 thèmes) ; au boot,
         themes.js (initTheme) re-valide le nom complet et corrige un éventuel
         nom inconnu. try/catch : localStorage peut jeter (mode privé). -->
    <script>
        (function () {
            try {
                var saved = localStorage.getItem('aikoreTheme');
                if (!saved || !/^[a-z0-9-]+-(dark|light)$/.test(saved)) return;
                var root = document.documentElement;
                root.setAttribute('data-theme', saved);
                root.setAttribute('data-mode', /-light$/.test(saved) ? 'light' : 'dark');
            } catch (e) { /* stockage indisponible — replis CSS par défaut */ }
        })();
    </script>
    <!-- Theme layer: semantic --ak-* variables (maps HolafTokens --holaf-*),
         loaded FIRST so the app CSS can consume it (refactor lot). -->
    <link rel="stylesheet" href="/static/css/theme.css">
    <link rel="stylesheet" href="/static/css/base.css">
    <link rel="stylesheet" href="/static/css/instances.css">
    <link rel="stylesheet" href="/static/css/modals.css">
    <link rel="stylesheet" href="/static/css/components.css">
    <link rel="stylesheet" href="/static/css/tools.css">
    <!-- NEW: ansi_up for log colors (Browser compatible).
         FIX(perf): was a parser-blocking script in <head> — a slow/unreachable
         CDN froze the FIRST PAINT of the entire page (blank screen). `defer`
         keeps execution order (still runs before the main.js module) without
         blocking rendering. -->
    <script src="/static/vendor/ansi_up-5.1.0.min.js" integrity="sha384-dAnYURSL1lFGH3o8Q9bh1OiIOOWSCXUnUu0lKq9yvQR6xbkaJ0T//hAHy4TJK0iP" crossorigin="anonymous" defer></script>
    <!-- NEW: Xterm.js styles -->
    <link rel="stylesheet" href="/static/vendor/xterm-5.3.0.min.css" integrity="sha384-9ftsg11+LSxVUaknegCfeKvlkO9EdIPI2op725RqY87IvhyGjElmpjZlP3LhTQjn" crossorigin="anonymous" />
    <!-- NEW: CodeMirror for syntax highlighting -->
    <link rel="stylesheet" href="/static/vendor/codemirror-5.65.16.min.css" integrity="sha384-zaeBlB/vwYsDRSlFajnDd7OydJ0cWk+c2OWybl3eSUf6hW2EbhlCsQPqKr3gkznT" crossorigin="anonymous" />
    <link rel="stylesheet" href="/static/vendor/codemirror-darcula-5.65.16.min.css" integrity="sha384-O7baQ60DV8PF9lmTWsCobbRqqwybdAMd27xf3MCGJPyaiJOUgqR5MD/l2KvMVqan" crossorigin="anonymous" />

    <!-- Holaf Lib — brique FONDATION (tokens de page --holaf-*).
         EXCEPTION à la règle « briques holaf importées en ESM » (cf. le
         commentaire en fin de <body>) : holaf-tokens 0.3.0 est CLASSIC-ONLY,
         il n'a AUCUN export top-level (un import ESM ne fournirait rien ; un
         export {} le casserait en script classique). API via window.HolafTokens.
         `defer` : ne bloque pas le parsing (même doctrine que le FIX(perf)
         ansi_up/CDN ci-dessous) ; l'ordre documentaire garantit son exécution
         AVANT les autres scripts defer et AVANT main.js (module, defer par
         défaut) — js/themes.js s'appuie sur cette garantie. -->
    <script src="/static/vendor/holaf-tokens.js" defer></script>

    <style>
        /* Satellite Tree Visuals */
        .name-cell-wrapper {
            display: flex;
            align-items: center;
            position: relative;
        }

        .tree-connector {
            display: inline-block;
            width: 15px;
            height: 25px; /* Adjust based on row height */
            border-bottom: 2px solid var(--ak-text-ghost);
            border-left: 2px solid var(--ak-text-ghost);
            margin-right: 8px;
            margin-top: -14px; /* Lift the L shape to connect to parent */
            opacity: 0.6;
        }

        /* Row "Dirty" State (Modified but not saved) */
        tr.row-dirty td {
            background-color: var(--ak-warn-soft) !important; /* Subtle yellow tint */
            border-top: 1px solid var(--ak-warn-border);
            border-bottom: 1px solid var(--ak-warn-border);
        }

        /* Global Save Button */
        #global-save-btn {
            margin-left: 10px;
            background-color: var(--ak-success); /* Green */
            color: var(--ak-on-color);
            display: none; /* Hidden by default until changes exist */
        }
        #global-save-btn:hover {
            background-color: var(--ak-success-hover);
        }
    </style>
</head>

<body>
    <div class="main-container">
        <h1 class="main-title">AiKore</h1>

        <!-- This is the PARENT for the VERTICAL split -->
        <div id="main-split" class="split-container split-vertical">

            <!-- PANNEAU SUPÉRIEUR : INSTANCE MANAGER -->
            <div id="instance-pane" class="pane">
                <div class="pane-header">
                    <h2>Instances Manager</h2>
                    <div class="pane-header-controls">
                        <div class="zoom-controls">
                            <button class="zoom-btn zoom-out" data-pane="instance" title="Zoom out">−</button>
                            <span class="zoom-label" data-pane="instance">100%</span>
                            <button class="zoom-btn zoom-in" data-pane="instance" title="Zoom in">+</button>
                        </div>
                        <!-- Theme selector : libellé/icône/état remplis par
                             js/themeSelector.js au boot (le HTML ne porte
                             qu'un squelette neutre, sans thème en dur). -->
                        <button id="theme-select-trigger" class="theme-select-trigger" type="button"
                            aria-haspopup="listbox" aria-expanded="false" title="Theme"
                            aria-label="Choose theme">
                            <span id="theme-select-icon" class="theme-select-icon" aria-hidden="true"></span>
                            <span id="theme-select-label" class="theme-select-label">Theme</span>
                            <span class="theme-select-arrow" aria-hidden="true"></span>
                        </button>
                        <button class="add-new-btn">Add New Instance</button>
                        <button id="global-save-btn" class="action-btn">Save Changes (<span id="dirty-count">0</span>)</button>
                    </div>
                </div>
                <div class="pane-content table-container">
                    <table id="instances-table" class="instances-table">
                        <thead>
                            <tr>
                                <th class="drag-handle-column"></th>
                                <th style="width: 15%;">Name</th>
                                <th style="width: 15%;">Base Blueprint</th>
                                <th>Environment</th>
                                <th>Output Path</th>
                                <th>GPU IDs</th>
                                <th>Autostart</th>
                                <th>Persistent UI</th>
                                <th class="status-column">Status</th>
                                <th>Custom Address</th>
                                <th>Port</th>
                                <th class="actions-column">Actions</th>
                            </tr>
                        </thead>
                        <!-- Body content is generated by JS using multiple tbody elements for grouping -->
                    </table>
                </div>
            </div>

            <!-- This is the PARENT for the HORIZONTAL split -->
            <div id="bottom-split" class="split-container split-horizontal">
                <!-- Colonne de gauche : Outils -->
                <div id="tools-pane" class="pane">
                    <div class="pane-header">
                        <h2 id="tools-pane-title">Tools / Welcome</h2>
                        <div class="pane-header-controls">
                            <div class="zoom-controls">
                                <button class="zoom-btn zoom-out" data-pane="tools" title="Zoom out">−</button>
                                <span class="zoom-label" data-pane="tools">100%</span>
                                <button class="zoom-btn zoom-in" data-pane="tools" title="Zoom in">+</button>
                            </div>
                            <button id="tools-close-btn" class="close-btn hidden">&times;</button>
                        </div>
                    </div>
                    <div class="pane-content">
                        <!-- Container for the Welcome Screen (visible by default) -->
                        <div id="welcome-screen-container">
                            <iframe id="welcome-iframe" src="about:blank" frameborder="0"></iframe>
                        </div>

                        <!-- Container for the Log Viewer (hidden by default) -->
                        <div id="log-viewer-container" class="terminal-style hidden">
                            <pre><code id="log-content-area"></code></pre>
                        </div>

                        <!-- Container for the File Editor (hidden by default) -->
                        <div id="editor-container" class="hidden">
                            <textarea id="file-editor-textarea" spellcheck="false"></textarea>
                            <div class="editor-actions">
                                <button id="editor-save-custom-btn" class="action-btn">Save as Custom Blueprint</button>
                                <button id="editor-update-btn" class="action-btn">Update Instance</button>
                            </div>
                        </div>

                        <!-- Container for the embedded Instance View (hidden by default) -->
                        <div id="instance-view-container" class="hidden">
                            <iframe id="instance-iframe" src="about:blank" frameborder="0"></iframe>
                        </div>

                        <!-- NEW: Container for the Terminal (hidden by default) -->
                        <div id="terminal-view-container" class="hidden">
                            <div id="terminal-content"></div>
                        </div>

                        <!-- NEW: Container for the Version Check tool (hidden by default) -->
                        <div id="version-check-container" class="hidden">
                            <div class="terminal-style">
                                <h3>Version Information</h3>
                                <pre><code id="version-check-versions-area"></code></pre>
                            </div>
                            <div class="terminal-style" style="margin-top: 20px;">
                                <h3>Dependency Conflicts</h3>
                                <pre><code id="version-check-conflicts-area"></code></pre>
                            </div>
                        </div>
                    </div>
                </div>
                <!-- Colonne de droite : Monitoring -->
                <div id="monitoring-pane" class="pane">
                    <div class="pane-header">
                        <h2>System Monitoring</h2>
                        <div class="pane-header-controls">
                            <div class="zoom-controls">
                                <button class="zoom-btn zoom-out" data-pane="monitoring" title="Zoom out">−</button>
                                <span class="zoom-label" data-pane="monitoring">100%</span>
                                <button class="zoom-btn zoom-in" data-pane="monitoring" title="Zoom in">+</button>
                            </div>
                        </div>
                    </div>
                    <div class="pane-content" id="system-stats-container">
                        <!-- System Stats will be dynamically inserted here -->
                        <div class="system-stat-block">
                            <span class="system-block-name">System</span>
                            <div class="system-block-metrics">
                                <div class="system-stat-row">
                                    <span class="stat-label">CPU</span>
                                    <div class="progress-bar-container">
                                        <div id="cpu-progress" class="progress-bar"></div>
                                    </div>
                                    <span id="cpu-percent-text" class="stat-value">...</span>
                                </div>
                                <div class="system-stat-row">
                                    <span class="stat-label">RAM</span>
                                    <div class="progress-bar-container">
                                        <div id="ram-progress" class="progress-bar"></div>
                                    </div>
                                    <span id="ram-usage-text" class="stat-value">...</span>
                                </div>
                            </div>
                        </div>

                        <div id="gpu-stats-container">
                            <!-- GPU stats will be populated by JavaScript -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Template for a single GPU display -->
    <template id="gpu-stat-template">
        <div class="gpu-stat">
            <span class="gpu-name">GPU 0: NVIDIA GeForce RTX 3090</span>
            <div class="gpu-metrics">
                <div class="gpu-metric">
                    <span class="stat-label">VRAM</span>
                    <div class="progress-bar-container">
                        <div class="progress-bar vram-progress"></div>
                    </div>
                    <span class="stat-value vram-usage-text">...</span>
                </div>
                <div class="gpu-metric">
                    <span class="stat-label">Util.</span>
                    <div class="progress-bar-container">
                        <div class="progress-bar util-progress"></div>
                    </div>
                    <span class="stat-value util-percent-text">...</span>
                </div>
            </div>
        </div>
    </template>

    <!-- Universal Context Menu for Tools -->
    <div id="tools-context-menu" class="context-menu">
        <button class="context-item" data-action="terminal">Terminal</button>
        <button class="context-item" data-action="script">Edit Script</button>
        <button class="context-item" data-action="manage-wheels">Manage Wheels</button>
        <button class="context-item" data-action="version-check">Versions Check</button>
        <button class="context-item" data-action="rebuild-env">Rebuild Environment</button>
        <button class="context-item" data-action="clone">Clone</button>
        <button class="context-item" data-action="instantiate">Instantiate</button>
        <button class="context-item" data-action="output_viewer" disabled>Output Viewer</button>
    </div>

    <!-- FIX(perf): all CDN libs below are `defer` — they used to block the
         parser right before main.js, delaying DOMContentLoaded (and therefore
         the whole app boot + first instances fetch) by the full download time
         of all 7 libraries. `defer` parallelizes the downloads and preserves
         execution order (each script still runs before the main.js module).
         Versions pinned: split.js was resolved via an unpkg 302 redirect on
         every page load; sortablejs@latest is a floating tag (audit finding). -->
    <!-- Holaf Lib Briques : consommées via IMPORT ESM explicite (`../vendor/...`)
         dans chaque module (api/ui/modals/main). NE PAS les charger ici en
         <script src> classique : ce sont des fichiers DUAL dont le `export {}`
         top-level provoquerait un SyntaxError en script classique, et l'ordre
         d'exécution ne garantirait pas les globals window.Holaf*.
         SEULE EXCEPTION : holaf-tokens.js (fondation, classic-only SANS export)
         — chargée en <script defer> dans le <head>. -->
    <!-- Split.js library -->
    <script src="/static/vendor/split-1.6.5.min.js" integrity="sha384-q2ksSc8z6Q4ZUnxlfZj9AXZLpSdWmD3q/YrId1twTeNHh56fNh98YbJSpppzGUvL" crossorigin="anonymous" defer></script>
    <!-- NEW: Xterm.js library and Fit Addon -->
    <script src="/static/vendor/xterm-5.3.0.min.js" integrity="sha384-xjfWUeCWdMtvpAb/SmM6lMzS6pQGcQa0loOl1d97j6Odw0vjK9nW3+dTb/bn/mwH" crossorigin="anonymous" defer></script>
    <script src="/static/vendor/xterm-addon-fit-0.8.0.min.js" integrity="sha384-dpjGwSSISUTz2taP54Bor7qkyMR20sSO9oe11UVYnGs2/YdUBf7HW30XKQx9PCzn" crossorigin="anonymous" defer></script>
    <!-- NEW: CodeMirror library and Shell mode -->
    <script src="/static/vendor/codemirror-5.65.16.min.js" integrity="sha384-ZYmwuq4n2gOcNxMSiJ6jyTj+BbIrilr7p6dlq6q5nmSWKmsH9UU4K1qqjycMkfmR" crossorigin="anonymous" defer></script>
    <script src="/static/vendor/codemirror-shell-5.65.16.min.js" integrity="sha384-dmPRq54XNtYnlnAo7QrwJnZNa5r0JP5gU8z4H0686Cgz37qrR2jmNaDHUXyMI4wn" crossorigin="anonymous" defer></script>
    <!-- Sortable.js for drag-and-drop -->
    <script src="/static/vendor/sortable-1.15.7.min.js" integrity="sha384-DgmC6Xe2bSN2WjTDXzWYbUbxyhNP+NNkGDR/g78pCXV7E7rcVTGxVg0uIVCUUcBc" crossorigin="anonymous" defer></script>
    <!-- Auth: inline stub executed before any module code. A deployment (reverse
         proxy, template injection) may define window.AIKORE_API_KEY beforehand;
         it stays null when authentication is disabled server-side. -->
    <script>window.AIKORE_API_KEY = window.AIKORE_API_KEY ?? null;</script>
    <!-- Our application script -->
    <script src="/static/js/main.js" type="module"></script>

</body>

</html>
