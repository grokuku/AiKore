name: Docker Build Test

on:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # Suppress Node 20 deprecation warnings on GitHub Actions runners using Node 24
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: pip install fastapi "pydantic>=2" sqlalchemy psutil requests

      - name: Run persistent test suites
        run: python3 tests/run_tests.py

  build-test:
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    concurrency:
      group: docker-build-test
      cancel-in-progress: true

    steps:
      # The image installs cuda-toolkit-13-0 (~multi-GB). GitHub-hosted runners
      # only expose ~14 GB of free disk, so reclaim space from preinstalled
      # toolchains we don't use (self-hosted runners had plenty of disk).
      - name: Free disk space on runner
        run: |
          set -x
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
            /usr/lib/jvm /usr/local/lib/android /opt/gradle
          sudo docker image prune -af || true
          df -h /

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: buildx-test
          restore-keys: buildx-

      - name: Lowercase image name for registry
        run: echo "IMAGE_NAME_LOWER=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Build and push test image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}:test
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max
          build-args: |
            GITHUB_REPO=${{ github.repository }}
            PYTORCH_RELEASE_TAG=torch-v2.9.0

      - name: Rotate cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache